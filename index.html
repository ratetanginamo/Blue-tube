<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlueTube</title>
<script src="js/youtube-api.js" defer></script>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; }
  input, button { padding: 8px; margin: 5px; }
  #results div { border-bottom: 1px solid #ccc; padding: 8px 0; }
</style>
</head>
<body>
<h1>BlueTube Search</h1>
<input type="text" id="searchInput" placeholder="Search videos">
<button id="searchBtn">Search</button>
<div id="results"></div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const searchBtn = document.getElementById('searchBtn');
    const searchInput = document.getElementById('searchInput');
    const resultsDiv = document.getElementById('results');

    searchBtn.addEventListener('click', async () => {
        const query = searchInput.value.trim();
        if(!query) return alert("Enter a search query");
        resultsDiv.innerHTML = "Loading...";
        try {
            const videos = await searchVideos(query);
            if(videos.length === 0) resultsDiv.innerHTML = "No videos found";
            else {
                resultsDiv.innerHTML = videos.map(v => `
                    <div>
                        <a href="video.html?id=${v.id.videoId}" target="_blank">${v.snippet.title}</a>
                        <p>${v.snippet.channelTitle}</p>
                    </div>
                `).join('');
            }
        } catch(e) {
            resultsDiv.innerHTML = "Error: " + e.message;
        }
    });
});
</script>
</body>
</html>
