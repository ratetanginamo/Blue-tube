<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlueTube Video</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div id="videoPlayer"></div>
    <h2 id="videoTitle"></h2>
    <p id="channelTitle"></p>
    <button id="likeBtn">👍 Like (<span id="likeCount">0</span>)</button>
    <button id="subBtn">🔔 Subscribe</button>

    <h3>💬 Comments</h3>
    <input type="text" id="commentInput" placeholder="Add a comment..." />
    <button id="commentBtn">Post</button>
    <div id="commentsContainer"></div>
  </div>

  <script src="js/youtube-api.js"></script>
  <script>
    const videoId = new URLSearchParams(window.location.search).get("id");

    const videoTitle = document.getElementById("videoTitle");
    const channelTitle = document.getElementById("channelTitle");
    const videoPlayer = document.getElementById("videoPlayer");
    const likeBtn = document.getElementById("likeBtn");
    const likeCount = document.getElementById("likeCount");
    const subBtn = document.getElementById("subBtn");
    const commentInput = document.getElementById("commentInput");
    const commentBtn = document.getElementById("commentBtn");
    const commentsContainer = document.getElementById("commentsContainer");

    // Persistent data
    let likes = parseInt(localStorage.getItem(`likes_${videoId}`)) || 0;
    let subscribed = localStorage.getItem("subscribed") === "true";
    let comments = JSON.parse(localStorage.getItem(`comments_${videoId}`) || "[]");

    likeCount.textContent = likes;
    subBtn.textContent = subscribed ? "✅ Subscribed" : "🔔 Subscribe";

    // Load video details
    async function loadVideo() {
      const video = await fetchVideoById(videoId);
      videoTitle.textContent = video.snippet.title;
      channelTitle.textContent = video.snippet.channelTitle;
      videoPlayer.innerHTML = `
        <iframe width="100%" height="315" 
          src="https://www.youtube.com/embed/${videoId}" 
          frameborder="0" allowfullscreen></iframe>`;
    }

    // Like button
    likeBtn.onclick = () => {
      likes++;
      localStorage.setItem(`likes_${videoId}`, likes);
      likeCount.textContent = likes;
    };

    // Subscribe button
    subBtn.onclick = () => {
      subscribed = !subscribed;
      localStorage.setItem("subscribed", subscribed);
      subBtn.textContent = subscribed ? "✅ Subscribed" : "🔔 Subscribe";
    };

    // Comments
    function renderComments() {
      commentsContainer.innerHTML = comments.map(c => `<p>🗨️ ${c}</p>`).join("");
    }

    commentBtn.onclick = () => {
      const text = commentInput.value.trim();
      if (!text) return;
      comments.push(text);
      localStorage.setItem(`comments_${videoId}`, JSON.stringify(comments));
      commentInput.value = "";
      renderComments();
    };

    renderComments();
    loadVideo();
  </script>
</body>
</html>
